name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Contracts – fmt, clippy, test, wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # Soroban SDK v28+ builds for wasm32v1-none (not wasm32-unknown-unknown).
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # The Soroban SDK build script requires stellar-cli v25.2.0+ to build wasm.
      - uses: stellar/stellar-cli@v28.1.0

      - name: Build wasm
        run: stellar contract build

  frontend:
    name: Frontend – lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  backend:
    name: Backend – typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  # Dependency vulnerability scan (issue #110).
  #
  # Advisory for now, not blocking: both lockfiles currently carry known
  # high/critical advisories that need a dependency bump rather than a CI change,
  # and a red gate nobody can pass would block unrelated PRs instead of fixing
  # them. `continue-on-error` keeps the finding visible in the run (the step is
  # still reported as failed, with the advisory list in its log) without failing
  # the workflow. CONTRIBUTING.md → Dependency security records the policy and
  # the condition for making this blocking.
  audit:
    name: Dependencies – vulnerability scan (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `npm audit` reads the committed lockfile, so no install is needed.
      # `--omit=dev` keeps the report to what actually ships: build/test tooling
      # (vite, vitest, eslint) is not audited here.
      - name: npm audit (backend)
        working-directory: backend
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

      - name: npm audit (frontend)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high --omit=dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      # Covers the whole workspace, including the dev-dependencies the contract
      # tests pull in. `--locked` builds cargo-audit against its own pinned
      # dependency set.
      - name: cargo audit (contracts)
        working-directory: contracts
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit
