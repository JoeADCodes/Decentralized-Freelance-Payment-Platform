server {
    # 8080, not 80: the container runs as the unprivileged `nginx` user and a
    # non-root process cannot bind a port below 1024. docker-compose maps
    # 5173 -> 8080.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service (issue #55).
    #
    # This is not optional decoration: the frontend image is built with
    # VITE_API_URL="" (see Dockerfile), so the app issues same-origin requests
    # like `GET /api/jobs` and this block forwards them to `backend:3000` over
    # the compose network. `backend` is a Docker service name and does not
    # resolve in the browser, which is why the app must not call it directly.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
