# One-command local stack: PostgreSQL + backend API + frontend.
#
#   docker compose up --build
#
# Backend:  http://localhost:3000  (GET /health)
# Frontend: http://localhost:5173
#
# The frontend image is built with VITE_API_URL="", so the app calls the API on
# its own origin and nginx forwards /api/ to the backend service. The API is
# therefore also reachable through the frontend: http://localhost:5173/api/jobs.
#
# Contract addresses are optional here; set them in the shell or in a root
# `.env` file to bake them into the frontend image, e.g.:
#   VITE_ESCROW_CONTRACT_ID=C... docker compose up --build
#
# Testnet values live in deployments/testnet.json.
#
# Both service containers run as non-root (issue #112): the backend drops to
# the image's `node` user (uid 1000), the frontend uses nginx-unprivileged
# (uid 101), which is why the frontend listens on 8080 — a non-root process
# cannot bind port 80.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: freelance_stellar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freelance_stellar"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/freelance_stellar
      # Dev-only placeholder. Must be >= 32 chars (enforced by the config schema).
      JWT_SECRET: dev-only-insecure-secret-change-me-please
      STELLAR_NETWORK: testnet
      HORIZON_URL: https://horizon-testnet.stellar.org
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      INDEXER_POLL_INTERVAL_MS: 5000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_NETWORK: ${VITE_NETWORK:-testnet}
        # Empty on purpose: the app then calls `/api/...` on its own origin and
        # nginx proxies it to `backend:3000` (issue #55). An absolute URL here
        # would make the browser reach for the backend service name, which only
        # resolves inside the compose network.
        VITE_API_URL: ""
        VITE_ESCROW_CONTRACT_ID: ${VITE_ESCROW_CONTRACT_ID:-}
        VITE_DISPUTE_CONTRACT_ID: ${VITE_DISPUTE_CONTRACT_ID:-}
        VITE_REPUTATION_CONTRACT_ID: ${VITE_REPUTATION_CONTRACT_ID:-}
        VITE_USDC_CONTRACT_ID: ${VITE_USDC_CONTRACT_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Container listens on 8080 (unprivileged nginx); host side stays 5173.
      - "5173:8080"

volumes:
  postgres_data:
